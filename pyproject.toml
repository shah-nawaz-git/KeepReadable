[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "keepreadable"
version = "0.1.0"
description = "Local-first personal digital archive auditing"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { file = "LICENSE" }
dependencies = [
  "PySide6>=6.7",
  "SQLAlchemy>=2.0",
  "pydantic>=2.6",
  "pypdf>=4",
  "pikepdf>=8",
  "Pillow>=10",
  "python-docx>=1.1",
  "openpyxl>=3.1",
  "python-pptx>=0.6.23",
  "PyYAML>=6",
  "platformdirs>=4",
  "reportlab>=4",
  "Jinja2>=3.1",
  "defusedxml>=0.7",
]

[project.scripts]
keepreadable = "keepreadable.app:main"
keepreadable-cli = "keepreadable.cli:main"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-qt>=4.4",
  "pytest-cov",
  "pytest-timeout",
  "ruff",
  "mypy",
  "types-PyYAML",
  "types-reportlab",
  "pyinstaller>=6",
  "pip-audit",
  "psutil",
]

[tool.uv]
exclude-newer = "2026-09-19T00:00:00Z"

[tool.hatch.build.targets.wheel]
packages = ["src/keepreadable"]
force-include = { "src/keepreadable/resources/tools.lock.json" = "keepreadable/resources/tools.lock.json", "src/keepreadable/resources/icon.png" = "keepreadable/resources/icon.png", "src/keepreadable/resources/icon.ico" = "keepreadable/resources/icon.ico", "src/keepreadable/policies/formats.yml" = "keepreadable/policies/formats.yml", "src/keepreadable/ui/theme/style.qss" = "keepreadable/ui/theme/style.qss", "src/keepreadable/reporting/templates/report.html.j2" = "keepreadable/reporting/templates/report.html.j2" }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PL", "RUF"]
ignore = ["PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR2004", "PLR0917"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["pikepdf.*", "docx.*", "pptx.*", "openpyxl.*", "reportlab.*", "defusedxml.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
addopts = "--strict-markers -m 'not benchmark'"
markers = [
  "external_tools: requires Siegfried or FFmpeg",
  "slow: slow-running tests",
  "ui: UI tests",
  "e2e: end-to-end tests",
  "benchmark: performance benchmark tests",
]
